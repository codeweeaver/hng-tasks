<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Card</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <article data-testid="test-todo-card" aria-label="Todo task card">
      <!-- Top: checkbox + title -->
      <div class="card-top">
        <div class="checkbox-wrapper">
          <label
            for="todo-complete"
            class="sr-only"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip: rect(0, 0, 0, 0);
              white-space: nowrap;
            "
          >
            Mark task as complete
          </label>
          <input
            type="checkbox"
            id="todo-complete"
            data-testid="test-todo-complete-toggle"
            aria-label="Mark task as complete"
          />
        </div>
        <h2 data-testid="test-todo-title">
          Redesign the onboarding flow for mobile users
        </h2>
      </div>

      <!-- Badges: priority + status -->
      <div class="badges" role="group" aria-label="Task metadata">
        <span
          class="badge"
          data-testid="test-todo-priority"
          data-value="High"
          aria-label="Priority: High"
        >
          🔴 High
        </span>
        <span
          class="badge status-badge"
          data-testid="test-todo-status"
          data-value="In Progress"
          aria-label="Status: In Progress"
        >
          🔵 In Progress
        </span>
      </div>

      <!-- Description -->
      <p data-testid="test-todo-description">
        Audit the current onboarding screens, identify drop-off points, and
        create a simplified 3-step flow with clear progress indicators and
        accessible form controls.
      </p>

      <!-- Due date + time remaining -->
      <div class="date-row">
        <span class="date-chip">
          <!-- calendar icon -->
          <svg
            width="13"
            height="13"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <rect
              x="1"
              y="3"
              width="14"
              height="12"
              rx="2"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path d="M1 7h14" stroke="currentColor" stroke-width="1.5" />
            <path
              d="M5 1v4M11 1v4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <time
            data-testid="test-todo-due-date"
            id="due-date-display"
            datetime="2026-05-01T18:00:00Z"
          >
            Due May 1, 2026
          </time>
        </span>

        <span
          data-testid="test-todo-time-remaining"
          id="time-remaining"
          class="upcoming"
          aria-live="polite"
          aria-label="Time remaining"
        >
          <!-- clock icon -->
          <svg
            width="13"
            height="13"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="8"
              cy="8"
              r="6.5"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="M8 5v3.5l2 1.5"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span id="time-remaining-text">Calculating…</span>
        </span>
      </div>

      <div class="divider" role="separator"></div>

      <!-- Tags -->
      <ul data-testid="test-todo-tags" role="list" aria-label="Tags">
        <li data-testid="test-todo-tag-work">work</li>
        <li data-testid="test-todo-tag-urgent">urgent</li>
        <li>design</li>
      </ul>

      <!-- Action buttons -->
      <div class="card-actions">
        <button
          class="btn"
          data-testid="test-todo-edit-button"
          aria-label="Edit task"
          type="button"
        >
          <!-- pencil icon -->
          <svg
            width="13"
            height="13"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13H3v-2L11.5 2.5Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </svg>
          Edit
        </button>
        <button
          class="btn"
          data-testid="test-todo-delete-button"
          aria-label="Delete task"
          type="button"
        >
          <!-- trash icon -->
          <svg
            width="13"
            height="13"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M2 4h12M6 4V2h4v2M5 4v9a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Delete
        </button>
      </div>
    </article>

    <script src="main.js"></script>
  </body>
</html>
